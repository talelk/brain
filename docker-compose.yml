# Keyrus Brain single-host deployment (T48).
# Governor + its data volume. TencentDB and the sandbox launcher are
# separate operator services; point BRAIN_TENCENTDB_URL at the memory
# service when deployed.
services:
  governor:
    build: .
    image: brain-governor:t48
    restart: unless-stopped
    environment:
      BRAIN_DATA_DIR: /data
      PORT: "3100"
      BRAIN_BASE_URL: ${BRAIN_BASE_URL:-http://127.0.0.1:3100}
      BRAIN_TENCENTDB_URL: ${BRAIN_TENCENTDB_URL:-}
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - brain-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

volumes:
  brain-data:
