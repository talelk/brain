# One Governor with its data in a volume, on this machine's port 3100. Runners are separate: a runner host runs the launcher and
# a runner (docs/wiki/ops-live-server.md shows the demo host's layout; `pnpm brain start` runs everything locally without this file).
services:
  governor:
    build: .
    image: brain-governor
    restart: unless-stopped
    environment:
      BRAIN_BASE_URL: ${BRAIN_BASE_URL:-http://localhost:3100}
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - brain-data:/data

volumes:
  brain-data:
