packages:
  - apps/*
  - packages/contracts
overrides:
  zod: 4.6.7
  undici: 8.12.2
  # @talelk/newui-tailwind@1.0.2 shipped with an unresolved workspace: protocol for tokens (newui#publish); pin the published version.
  "@talelk/newui-tokens": 0.2.0
  # Dependabot moderate advisories on transitive packages: pin patched versions.
  "esbuild@<0.25.0": 0.25.0
  "postcss-selector-parser@<6.1.5": 6.1.5
  "@earendil-works/pi-coding-agent>minimatch": 11.0.1
  "@typescript-eslint/typescript-estree>minimatch": 11.0.1
  "eslint>minimatch": 11.0.1
  "@eslint/config-array>minimatch": 11.0.1
strictPeerDependencies: true
engineStrict: true
saveExact: true
minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.311'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.311'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.311'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.311'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.311'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.311'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.311'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.311'
  - '@anthropic-ai/claude-agent-sdk@0.3.311'
  - '@better-auth/core@1.7.14'
  - '@better-auth/drizzle-adapter@1.7.14'
  - '@better-auth/kysely-adapter@1.7.14'
  - '@better-auth/memory-adapter@1.7.14'
  - '@better-auth/mongo-adapter@1.7.14'
  - '@better-auth/prisma-adapter@1.7.14'
  - '@better-auth/telemetry@1.7.14'
  - '@talelk/newui-atoms@1.4.0'
  - '@talelk/newui-molecules@2.4.0'
  - '@talelk/newui-organisms@2.3.0'
  - '@talelk/newui-templates@1.2.0'
  - '@typescript-eslint/eslint-plugin@8.72.1'
  - '@typescript-eslint/parser@8.72.1'
  - '@typescript-eslint/project-service@8.72.1'
  - '@typescript-eslint/scope-manager@8.72.1'
  - '@typescript-eslint/tsconfig-utils@8.72.1'
  - '@typescript-eslint/type-utils@8.72.1'
  - '@typescript-eslint/types@8.72.1'
  - '@typescript-eslint/typescript-estree@8.72.1'
  - '@typescript-eslint/utils@8.72.1'
  - '@typescript-eslint/visitor-keys@8.72.1'
  - better-auth@1.7.14
  - typescript-eslint@8.72.1
  - '@talelk/newui-tailwind@1.1.0'
  - '@talelk/newui-tokens@0.2.0'
  - '@talelk/newui-data@1.1.0'
  - '@talelk/newui-charts@1.1.0'
allowBuilds:
  '@google/genai': false
  better-sqlite3: true
  esbuild: true
  protobufjs: false
  unrs-resolver: true
skills:
  dirs:
    - .pi-agent/skills
permissions:
  '@talelk/newui-atoms':
    skills: true
  '@talelk/newui-molecules':
    skills: true
  '@talelk/newui-organisms':
    skills: true
  '@talelk/newui-templates':
    skills: true
