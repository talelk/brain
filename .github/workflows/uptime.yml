name: uptime
# An outside check: fails (and GitHub notifies the owner) when the live site is not ready.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Live and ready
        run: |
          url="${BRAIN_URL:-https://brain.mykeyrus.tn}"
          curl -fsS --max-time 20 --retry 2 --retry-delay 10 "$url/health/live"
          curl -fsS --max-time 20 "$url/health/ready"
        env:
          BRAIN_URL: ${{ vars.BRAIN_PUBLIC_URL }}
