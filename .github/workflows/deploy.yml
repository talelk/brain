name: deploy
# Manual: a person starts it. The runner joins the tailnet as an ephemeral node, deploys main to the demo server
# and leaves. scripts/deploy-demo.sh drains running attempts first (waits up to 15 min); `force` skips the drain.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy even if attempts are running (interrupts them)"
        type: boolean
        default: false
concurrency:
  group: deploy-demo
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: demo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Gate: the standing test set must not have dropped more than 10 points (skips clearly when no model is reachable).
      - run: pnpm exec tsx scripts/standing-tests/gate.ts || [ "$?" = 3 ]
        continue-on-error: false
      - uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_DEPLOY_AUTHKEY }}  # ephemeral, tagged, deploy-only key
          tags: tag:ci-deploy
      - name: Deploy
        env:
          BRAIN_DEPLOY_HOST: ${{ vars.BRAIN_DEPLOY_HOST }}
          BRAIN_DEPLOY_PORT: ${{ vars.BRAIN_DEPLOY_PORT }}
          BRAIN_DEPLOY_USER: ${{ vars.BRAIN_DEPLOY_USER }}
          BRAIN_DEPLOY_SUDO_PASSWORD: ${{ secrets.BRAIN_DEPLOY_SUDO_PASSWORD }}
          BRAIN_DEPLOY_FORCE: ${{ inputs.force && '1' || '0' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.BRAIN_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$BRAIN_DEPLOY_PORT" "$BRAIN_DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          scripts/deploy-demo.sh
