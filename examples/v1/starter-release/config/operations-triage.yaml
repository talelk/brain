{
  "apiVersion": "brain.keyrus/v1",
  "kind": "Workflow",
  "metadata": {
    "id": "operations-triage",
    "version": "1.0.0"
  },
  "spec": {
    "inputSchemaRef": "schemas/operations-input.json",
    "outputSchemaRef": "schemas/workflow-output.json",
    "jobs": {
      "respond": {
        "kind": "dispatch",
        "needs": [],
        "input": {
          "situation": {
            "source": "input",
            "pointer": "/situation"
          }
        },
        "outputSchemaRef": "schemas/operations-output.json",
        "timeoutSeconds": 120,
        "uses": {
          "type": "agent",
          "release": {
            "id": "operations-assistant",
            "digest": "sha256:50ad0891a57eab836239f37a116acc81c5357e1d5d0bb65b92d96fa05abc9415"
          }
        },
        "runsOn": {
          "group": "agents",
          "all": [
            "os:linux"
          ],
          "resources": {
            "cpuMillicores": 500,
            "memoryMb": 256,
            "diskMb": 256,
            "slots": 1
          },
          "isolation": "ephemeral-container"
        },
        "effectClass": "read"
      },
      "validate": {
        "kind": "eval",
        "needs": [
          "respond"
        ],
        "input": {
          "kind": {
            "source": "literal",
            "value": "operations-triage"
          },
          "report": {
            "source": "job",
            "jobId": "respond",
            "pointer": ""
          }
        },
        "outputSchemaRef": "schemas/validation-output.json",
        "timeoutSeconds": 30,
        "evaluator": {
          "id": "operations-validator",
          "digest": "sha256:874dd7a4cf56ca4d25dc9194b5767fb331251f1109061572aa75ce09c5a9ba0f"
        },
        "runsOn": {
          "group": "evaluators",
          "all": [
            "os:linux",
            "tool:bash",
            "tool:python3"
          ],
          "resources": {
            "cpuMillicores": 500,
            "memoryMb": 256,
            "diskMb": 256,
            "slots": 1
          },
          "isolation": "ephemeral-container"
        },
        "independence": "L1"
      }
    },
    "outputs": {
      "response": {
        "source": "job",
        "jobId": "respond",
        "pointer": ""
      },
      "passed": {
        "source": "job",
        "jobId": "validate",
        "pointer": "/passed"
      }
    },
    "failFast": true,
    "deadlineSeconds": 300
  }
}
