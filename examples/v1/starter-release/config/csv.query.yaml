{
  "apiVersion": "brain.keyrus/v1",
  "kind": "Tool",
  "metadata": {
    "id": "csv.query",
    "version": "1.0.0"
  },
  "spec": {
    "effectClass": "read",
    "inputSchemaRef": "schemas/csv-query-input.json",
    "outputSchemaRef": "schemas/csv-query-output.json",
    "requiredCapabilities": [
      "tool:bash",
      "tool:python3"
    ],
    "timeoutSeconds": 20,
    "maxOutputBytes": 65536,
    "allowedEnvironments": [
      "local"
    ],
    "owner": "team_operations",
    "license": "LicenseRef-Internal",
    "description": "Runs one read-only SQL SELECT over a CSV file of this workspace. The file is the table data; nothing else can be read or changed.",
    "entrypoint": "run.sh",
    "testEntrypoint": "test.sh"
  }
}
