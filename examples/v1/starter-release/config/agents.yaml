{
  "apiVersion": "brain.keyrus/v1",
  "kind": "RunnerGroup",
  "metadata": {
    "id": "agents",
    "version": "1.0.0"
  },
  "spec": {
    "organizationRef": "org-local",
    "allowedWorkspaces": [
      "operations"
    ],
    "jobClasses": [
      "agent"
    ],
    "isolation": "ephemeral-container",
    "trust": "agent",
    "maxSlotsPerRunner": 1,
    "reserve": {
      "cpuMillicores": 100,
      "memoryMb": 128,
      "diskMb": 128,
      "slots": 0
    }
  }
}
