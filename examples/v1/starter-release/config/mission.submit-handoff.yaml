{
  "apiVersion": "brain.keyrus/v1",
  "kind": "Tool",
  "metadata": {
    "id": "mission.submit-handoff",
    "version": "1.0.0"
  },
  "spec": {
    "effectClass": "read",
    "inputSchemaRef": "schemas/mission-submit-handoff-input.json",
    "outputSchemaRef": "schemas/mission-submit-handoff-output.json",
    "requiredCapabilities": [
      "tool:bash",
      "tool:python3"
    ],
    "timeoutSeconds": 20,
    "maxOutputBytes": 65536,
    "allowedEnvironments": [
      "local"
    ],
    "owner": "team_operations",
    "license": "LicenseRef-Internal",
    "description": "Submits the handoff notes of the task this session works on, for the tasks that build on it. A later submission replaces the earlier one. The notes stay claims: Brain derives the verified facts itself.",
    "entrypoint": "run.sh",
    "testEntrypoint": "test.sh"
  }
}
