{
  "apiVersion": "brain.keyrus/v1",
  "kind": "Tool",
  "metadata": {
    "id": "mission.ask",
    "version": "1.0.0"
  },
  "spec": {
    "effectClass": "read",
    "inputSchemaRef": "schemas/mission-ask-input.json",
    "outputSchemaRef": "schemas/mission-ask-output.json",
    "requiredCapabilities": [
      "tool:bash",
      "tool:python3"
    ],
    "timeoutSeconds": 20,
    "maxOutputBytes": 65536,
    "allowedEnvironments": [
      "local"
    ],
    "owner": "team_operations",
    "license": "LicenseRef-Internal",
    "description": "Asks a person one question about this mission when you cannot go on without their answer. It appears in their Needs you queue. Their answer reaches you as a message from a person (in this session if it can take it, otherwise in your next one); it never approves anything. You may ask at most 3 questions in a session and have at most 2 waiting at once, so ask only what you cannot decide yourself, then carry on without waiting.",
    "entrypoint": "run.sh",
    "testEntrypoint": "test.sh"
  }
}
