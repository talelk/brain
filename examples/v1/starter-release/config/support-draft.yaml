{
  "apiVersion": "brain.keyrus/v1",
  "kind": "Workflow",
  "metadata": {
    "id": "support-draft",
    "version": "1.0.0"
  },
  "spec": {
    "inputSchemaRef": "schemas/support-input.json",
    "outputSchemaRef": "schemas/workflow-output.json",
    "jobs": {
      "respond": {
        "kind": "dispatch",
        "needs": [],
        "input": {
          "title": {
            "source": "input",
            "pointer": "/title"
          },
          "body": {
            "source": "input",
            "pointer": "/body"
          }
        },
        "outputSchemaRef": "schemas/support-output.json",
        "timeoutSeconds": 120,
        "uses": {
          "type": "agent",
          "release": {
            "id": "support-analyst",
            "digest": "sha256:7f9909b668353a9baa1406f40974fb186ce2b7821e4a0e73de1ed50ed35f0abe"
          }
        },
        "runsOn": {
          "group": "agents",
          "all": [
            "os:linux"
          ],
          "resources": {
            "cpuMillicores": 500,
            "memoryMb": 256,
            "diskMb": 256,
            "slots": 1
          },
          "isolation": "ephemeral-container"
        },
        "effectClass": "read"
      },
      "validate": {
        "kind": "eval",
        "needs": [
          "respond"
        ],
        "input": {
          "kind": {
            "source": "literal",
            "value": "support-draft"
          },
          "report": {
            "source": "job",
            "jobId": "respond",
            "pointer": ""
          }
        },
        "outputSchemaRef": "schemas/validation-output.json",
        "timeoutSeconds": 30,
        "evaluator": {
          "id": "operations-validator",
          "digest": "sha256:874dd7a4cf56ca4d25dc9194b5767fb331251f1109061572aa75ce09c5a9ba0f"
        },
        "runsOn": {
          "group": "evaluators",
          "all": [
            "os:linux",
            "tool:bash",
            "tool:python3"
          ],
          "resources": {
            "cpuMillicores": 500,
            "memoryMb": 256,
            "diskMb": 256,
            "slots": 1
          },
          "isolation": "ephemeral-container"
        },
        "independence": "L1"
      }
    },
    "outputs": {
      "response": {
        "source": "job",
        "jobId": "respond",
        "pointer": ""
      },
      "passed": {
        "source": "job",
        "jobId": "validate",
        "pointer": "/passed"
      }
    },
    "failFast": true,
    "deadlineSeconds": 300
  }
}
