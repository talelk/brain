{
  "apiVersion": "brain.keyrus/v1",
  "kind": "Tool",
  "metadata": {
    "id": "mission.message-member",
    "version": "1.0.0"
  },
  "spec": {
    "effectClass": "read",
    "inputSchemaRef": "schemas/mission-message-member-input.json",
    "outputSchemaRef": "schemas/mission-message-member-output.json",
    "requiredCapabilities": [
      "tool:bash",
      "tool:python3"
    ],
    "timeoutSeconds": 20,
    "maxOutputBytes": 65536,
    "allowedEnvironments": [
      "local"
    ],
    "owner": "team_operations",
    "license": "LicenseRef-Internal",
    "description": "Sends one message to another team member of this mission by its member id. It reaches that member's next session (or its running one when it can take it) as a claim from you, never as an instruction or an approval. You cannot message yourself, interrupt a session or address the mission.",
    "entrypoint": "run.sh",
    "testEntrypoint": "test.sh"
  }
}
