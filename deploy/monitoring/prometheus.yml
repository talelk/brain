# Prometheus scrape configuration for Keyrus Brain. Put the metrics token (a random string of 16 or more characters) in an owner-only
# file in the Governor's data volume, name it with BRAIN_METRICS_TOKEN_FILE, and give Prometheus the same token through
# `credentials_file`. Without BRAIN_METRICS_TOKEN_FILE the Governor has no /metrics endpoint at all.
global:
  scrape_interval: 30s
rule_files:
  - brain-alerts.yml
scrape_configs:
  - job_name: brain
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/brain-metrics-token
    static_configs:
      - targets: ["127.0.0.1:3100"]
