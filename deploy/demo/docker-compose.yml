# The demo host's Governor (scripts/deploy-demo.sh installs this file as /srv/demos/brain/docker-compose.yml and writes .env).
# Layout there: src/ (this repository), data/ (the Governor's data, a plain folder owned by the deploy user so that
# `pnpm brain backup` reads it from the host), run/ (launcher socket, runner folder, egress grants), archive/ (data kept from before).
# nginx serves the public name from 127.0.0.1:3100. The same port is published on Docker's bridge address, which is where the
# egress proxy lets engine sandboxes reach the model gateway (BRAIN_GATEWAY_URL); nothing else can reach it there.
# Never run `docker compose down -v` here, and never delete data/ or archive/.
services:
  governor:
    build: ./src
    image: brain-governor:demo
    restart: unless-stopped
    user: "${BRAIN_UID}:${BRAIN_GID}"
    environment:
      BRAIN_BASE_URL: ${BRAIN_BASE_URL}
      BRAIN_GATEWAY_URL: http://host.docker.internal:3100
      BRAIN_LOCAL_RUNNER_TOKEN_FILE: /host-run/runner.token
    ports:
      - "127.0.0.1:3100:3100"
      - "${BRAIN_BRIDGE_IP}:3100:3100"
    volumes:
      - ./data:/data
      - ./run/governor:/host-run
