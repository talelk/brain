# Deploy on an execution host, separately from Governor. No central DB volume.
name: brain-runner
services:
  supervisor:
    image: ${BRAIN_RUNNER_IMAGE:?exact-image-digest-required}
    user: '10002:10002'
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    environment:
      BRAIN_GOVERNOR_URL: ${BRAIN_GOVERNOR_URL:?https-url-required}
      BRAIN_RUNNER_ID: ${BRAIN_RUNNER_ID:?runner-id-required}
      # The runner keeps its credential in <state dir>/credential.txt. The enrollment token is read on the first boot only and
      # may then be left empty: the credential is already in the runner_state volume.
      BRAIN_RUNNER_STATE_DIR: /state
      BRAIN_RUNNER_ENROLL_TOKEN: ${BRAIN_RUNNER_ENROLL_TOKEN:-}
      BRAIN_RUNNER_SLOTS: '1'
      BRAIN_LAUNCHER_SOCKET: /launcher/launcher.sock
      # Engines run in their own sandboxes (ADR 0067): the runner makes one directory per attempt here, and the launcher (its
      # BRAIN_LAUNCHER_ENGINE_STATE_ROOT, the same host directory, owned by the same uid as this service) mounts that one into the engine's container.
      BRAIN_RUNNER_ENGINE_STATE_DIR: /engine-state
    volumes:
      - runner_state:/state
      - ${BRAIN_ENGINE_STATE_DIR:?launcher-engine-state-root-required}:/engine-state
      - ${BRAIN_LAUNCHER_SOCKET_DIR:?constrained-launcher-socket-directory-required}:/launcher
    tmpfs: ['/tmp:size=64m,mode=1770,uid=10002,gid=10002']
    # Launcher is a separately managed trusted host service. Its constrained API
    # validates every mount/image/resource/egress profile. This is NOT docker.sock.
  # The egress proxy (ADR 0037): the only way a sandbox reaches a network. Sandboxes join the internal network and get a per-sandbox
  # grant of their workspace's allowed hosts; the launcher (BRAIN_LAUNCHER_EGRESS_GRANTS_DIR, same host directory) writes the grants.
  egress-proxy:
    image: ${BRAIN_EGRESS_PROXY_IMAGE:?exact-image-digest-required}
    user: '10003:10003'
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    environment:
      BRAIN_EGRESS_GRANTS_DIR: /grants
    volumes:
      - ${BRAIN_EGRESS_GRANTS_DIR:?launcher-grants-directory-required}:/grants:ro
    networks:
      brain-internal:
        aliases: [brain-egress-proxy]
      uplink: {}
volumes:
  runner_state: {}
networks:
  # Named, not project-prefixed: the launcher attaches sandboxes to the network called brain-internal. No route out except the proxy.
  brain-internal:
    name: brain-internal
    internal: true
  uplink: {}
