# TOPOLOGY REFERENCE ONLY. Images/entrypoints/secrets must be implemented and pinned in T48.
name: keyrus-brain
services:
  governor:
    image: ${BRAIN_GOVERNOR_IMAGE:?exact-image-digest-required}
    user: '10001:10001'
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    cpus: 2
    mem_limit: 2g
    pids_limit: 256
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      PORT: '3000'
      # Inside a container the Governor must listen on every interface for the published port to reach it.
      BRAIN_BIND_HOST: 0.0.0.0
      BRAIN_DATA_DIR: /data
      BRAIN_WEB_DIST_DIR: /app/web
      # The public origin people reach Brain at: sign-in cookies and every link in a notification use it.
      BRAIN_BASE_URL: ${BRAIN_BASE_URL:?https-origin-required}
    volumes:
      - brain_state:/data
    tmpfs: ['/tmp:size=128m,mode=1770,uid=10001,gid=10001']
    ports: ['127.0.0.1:3000:3000']
    networks: [control]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs']
      interval: 15s
      timeout: 3s
      retries: 3
volumes:
  brain_state: {}
networks:
  control: {}
