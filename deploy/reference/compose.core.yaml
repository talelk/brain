# TOPOLOGY REFERENCE ONLY. Images/entrypoints/secrets must be implemented and pinned in T48.
name: keyrus-brain
services:
  governor:
    image: ${BRAIN_GOVERNOR_IMAGE:?exact-image-digest-required}
    user: '10001:10001'
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    cpus: 2
    mem_limit: 2g
    pids_limit: 256
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      BRAIN_DATA_DIR: /data
      BRAIN_CONFIG_DIR: /releases
      # Proposed Brain image contract: immutable assets and reviewed foundation manifest.
      # T33/T48 implement these readers and copy the verified build outputs into the image.
      BRAIN_WEB_DIST_DIR: /app/web
      BRAIN_UI_FOUNDATION_MANIFEST_FILE: /app/ui/ui-foundation.json
      BRAIN_PUBLIC_URL: ${BRAIN_PUBLIC_URL:?https-origin-required}
      BRAIN_AUTH_SECRET_FILE: /run/secrets/auth_secret
    secrets: [auth_secret]
    volumes:
      - brain_state:/data
      - ${BRAIN_RELEASE_DIR:?read-only-release-directory-required}:/releases:ro
    tmpfs: ['/tmp:size=128m,mode=1770,uid=10001,gid=10001']
    ports: ['127.0.0.1:3000:3000']
    networks: [control]
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs']
      interval: 15s
      timeout: 3s
      retries: 3
volumes:
  brain_state: {}
networks:
  control: {}
secrets:
  auth_secret:
    file: ${BRAIN_AUTH_SECRET_PATH:?host-secret-file-required}
