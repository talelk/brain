[translations.fr]
description = "Un regard critique sur ce qu'un parcours a trouvé : vérifie les écrans et pages consignés pour la mise en page, l'accessibilité et la langue (français, arabe, de droite à gauche), puis accepte le parcours ou le renvoie."

[translations.ar]
description = "ناقد لما وجدته الجولة: يفحص الشاشات والصفحات المسجّلة من حيث التخطيط وإمكانية الوصول واللغة (الفرنسية والعربية والاتجاه من اليمين إلى اليسار)، ثم يقبل الجولة أو يعيدها."
