description = "Writes an agent's prompt and configuration as files in the project, from a stated job and its evaluation cases, runs the cases with a script it keeps beside them, and opens the pull request."
engine = ["pi", "claude"]
native = "all"
tools = ["git.open-pr", "task.note", "memory.search"]
model_in_commands = true

[limits]
spend_usd = 2.00

[translations.fr]
description = "Écrit le prompt et la configuration d'un agent comme fichiers du projet, à partir d'un travail décrit et de ses cas d'évaluation, exécute les cas avec un script gardé à côté d'eux, et ouvre la pull request."

[translations.ar]
description = "يكتب موجِّه الوكيل وإعداداته كملفات في المشروع، انطلاقًا من مهمة محدَّدة وحالات تقييمها، ويشغّل الحالات بسكربت يحفظه بجانبها، ويفتح طلب السحب (pull request)."
