title = "Weekly agent regression check"
description = "Every week, run the evaluation cases of the project's agents against their current prompts and have the judge score the answers, so a change that broke a case is found. A failed check waits for a person."

[trigger]
schedule = "45 8 * * 1"

[[step]]
id = "collect"
agent = "eval-author"
goal = """
List every agent of the project that has an evaluation file (evals/<agent>/cases.md), with \
its prompt and configuration paths and the number of cases. Say which agents have no \
evaluation file and which files changed since the last commit that touched their cases. Use \
memory.search ("agent rubric guidelines") for the rules. Return the list as Markdown. When no agent has an evaluation file, say so and where one goes: that is the result, not a failure."""

[[step]]
id = "run"
agent = "eval-runner"
goal = """
Run every case of every agent in your context against its current prompt, one model call per \
case, and keep each answer as /out/cases/<agent>/<case id>.md. Write the list of what ran as \
/out/regression-check.md. When there is no case to run, say so: that is the result, not a \
failure, and there is nothing to judge."""
after = ["collect"]
review_by = "eval-judge"
max_rounds = 1
target_score = 0.8

[translations.fr]
title = "Contrôle hebdomadaire de non-régression des agents"
description = "Chaque semaine, exécuter les cas d'évaluation des agents du projet avec leurs prompts actuels et faire noter les réponses par le juge, pour trouver un changement qui a cassé un cas. Une vérification échouée attend une personne."

[translations.ar]
title = "فحص أسبوعي لتراجع الوكلاء"
description = "كل أسبوع، تُشغَّل حالات تقييم وكلاء المشروع على موجِّهاتهم الحالية ويقيّم الحَكَم الإجابات، فيُكتشف أي تغيير كسر حالة. الفحص الفاشل ينتظر شخصًا."
