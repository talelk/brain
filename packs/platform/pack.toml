name = "platform"
description = "For the platform workspace only: read-only tools that look across every workspace, and the capitalizer, which turns work that keeps repeating into tools and lessons proposed to the workspaces concerned."
requires = ["base"]

[translations.fr]
description = "Pour l'espace de travail de plateforme uniquement : des outils en lecture seule qui regardent tous les espaces de travail, et le capitaliseur, qui transforme le travail qui se répète en outils et en leçons proposés aux espaces concernés."

[translations.ar]
description = "لمساحة عمل المنصّة وحدها: أدوات للقراءة فقط تطّلع على كل مساحات العمل، والمُرسِّخ (capitalizer) الذي يحوّل العمل المتكرر إلى أدوات ودروس تُقترح على المساحات المعنية."
