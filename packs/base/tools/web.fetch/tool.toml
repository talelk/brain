description = """
Fetches one https address and returns its readable text (HTML is reduced to text). GET \
only: it reads and never submits anything. It reaches any public host; a workspace that wants fewer \
replaces this tool file with its own copy whose `network` lists the hosts it allows. A \
refusal or an error is an answer, not something to work around. Returns {"url", \
"final_url", "status", "content_type", "text", "truncated"}, or {"error": "<why>"}."""
effect = "read"
timeout_seconds = 30
needs = ["bash", "python3"]
secrets = []

[inputs.url]
type = "string"
description = "The full address, starting with https://. No user name or password in it."
required = true

[inputs.max_chars]
type = "integer"
description = "The most text to return, from 1 to 20000 characters. 8000 when left out."
required = false

[translations.fr]
description = "Récupère une adresse https et renvoie son texte lisible (le HTML est réduit à du texte). GET uniquement : il lit et n'envoie jamais rien. Il atteint n'importe quel hôte public ; un espace de travail qui veut moins remplace ce fichier d'outil par sa propre copie dont `network` liste les hôtes autorisés. Un refus ou une erreur est une réponse, pas un obstacle à contourner. Renvoie {\"url\", \"final_url\", \"status\", \"content_type\", \"text\", \"truncated\"}, ou {\"error\": \"<pourquoi>\"}."

[translations.fr.inputs.url]
description = "L'adresse complète, commençant par https://. Sans nom d'utilisateur ni mot de passe."

[translations.fr.inputs.max_chars]
description = "Le maximum de texte à renvoyer, de 1 à 20000 caractères. 8000 si omis."

[translations.ar]
description = "يجلب عنوان https واحدًا ويعيد نصه المقروء (يُختزل HTML إلى نص). GET فقط: يقرأ ولا يرسل شيئًا أبدًا. يصل إلى أي مضيف عام؛ ومساحة العمل التي تريد أقل تستبدل ملف هذه الأداة بنسختها الخاصة التي يسرد `network` فيها المضيفين المسموح بهم. الرفض أو الخطأ إجابة، لا عقبة يُلتفّ عليها. يعيد {\"url\", \"final_url\", \"status\", \"content_type\", \"text\", \"truncated\"}، أو {\"error\": \"<السبب>\"}."

[translations.ar.inputs.url]
description = "العنوان الكامل، ويبدأ بـ https://. دون اسم مستخدم أو كلمة مرور."

[translations.ar.inputs.max_chars]
description = "أقصى قدر من النص يُعاد، من 1 إلى 20000 حرف. 8000 إذا تُرك فارغًا."
