description = """
Asks a person one question about your current task. The task then waits and shows as \
needing a person until someone answers; you are run again with the answer in your context. \
Ask only when you cannot decide yourself and a wrong guess would waste the work. Ask one \
question that can be answered in a sentence, and give the options you see. After calling \
it, end your turn and say what you are waiting for. Returns {"status": "waiting"}."""
runs = "brain"
effect = "read"

[inputs.question]
type = "string"
description = "The question, with enough context to answer it without opening the task."
required = true

[outputs.status]
type = "string"
description = "`waiting`: the question is asked."
required = true

[translations.fr]
description = "Pose une question à une personne au sujet de votre tâche en cours. La tâche attend alors et apparaît comme ayant besoin d'une personne jusqu'à ce que quelqu'un réponde ; vous êtes relancé avec la réponse dans votre contexte. Ne demandez que lorsque vous ne pouvez pas décider seul et qu'une mauvaise supposition ferait perdre le travail. Posez une seule question, à laquelle on peut répondre en une phrase, et donnez les options que vous voyez. Après l'appel, terminez votre tour et dites ce que vous attendez. Renvoie {\"status\": \"waiting\"}."

[translations.fr.inputs.question]
description = "La question, avec assez de contexte pour y répondre sans ouvrir la tâche."

[translations.ar]
description = "يطرح سؤالًا واحدًا على شخص بشأن مهمتك الحالية. تنتظر المهمة حينها وتظهر على أنها بحاجة إلى شخص حتى يجيب أحد؛ ثم يُعاد تشغيلك والإجابة في سياقك. لا تسأل إلا عندما لا تستطيع القرار بنفسك ويكون التخمين الخاطئ مضيعةً للعمل. اطرح سؤالًا واحدًا يمكن الإجابة عنه بجملة، واذكر الخيارات التي تراها. بعد الاستدعاء، أنهِ دورك وقل ما الذي تنتظره. يعيد {\"status\": \"waiting\"}."

[translations.ar.inputs.question]
description = "السؤال، مع سياق كافٍ للإجابة عنه دون فتح المهمة."
