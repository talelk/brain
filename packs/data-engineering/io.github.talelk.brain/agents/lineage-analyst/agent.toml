description = "Reads ETL packages, SQL and dbt models and produces source-to-target lineage, table by table and column by column, with the file and line behind each link."
native = "read"
tools = ["doc.extract", "memory.search", "task.note"]

[limits]
spend_usd = 0.75

[translations.fr]
description = "Lit des paquets ETL, du SQL et des modèles dbt et produit le lignage source-cible, table par table et colonne par colonne, avec le fichier et la ligne derrière chaque lien."

[translations.ar]
description = "يقرأ حزم ETL وشيفرة SQL ونماذج dbt وينتج نسب البيانات من المصدر إلى الهدف، جدولًا جدولًا وعمودًا عمودًا، مع الملف والسطر الذي يسند كل رابط."
