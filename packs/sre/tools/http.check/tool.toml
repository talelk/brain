description = """
Checks whether one http or https address answers: sends a single GET, follows no \
redirect, and returns {"url", "ok", "status", "time_ms"}, plus "redirect" when the answer \
points elsewhere and "error" when there was no answer at all (then status is 0). "ok" is \
true for a status from 200 to 399. Read-only. It reaches only the hosts listed under \
`network`, and this pack ships that list empty, so every check reports an error until the \
workspace replaces this tool file with its own copy that names the hosts of its services. \
Take the addresses to check from the runbook in memory."""
effect = "read"
timeout_seconds = 20
needs = ["bash", "python3"]
network = []
secrets = []

[inputs.url]
type = "string"
description = "The full address to check, starting with http:// or https://. No user name or password in it."
required = true

[translations.fr]
description = "Vérifie si une adresse http ou https répond : envoie un seul GET, ne suit aucune redirection et renvoie {\"url\", \"ok\", \"status\", \"time_ms\"}, plus \"redirect\" lorsque la réponse pointe ailleurs et \"error\" lorsqu'il n'y a eu aucune réponse (status vaut alors 0). \"ok\" est vrai pour un statut de 200 à 399. Lecture seule. Il n'atteint que les hôtes listés sous `network`, et ce pack livre cette liste vide : chaque vérification signale donc une erreur tant que l'espace de travail n'a pas remplacé ce fichier d'outil par sa propre copie nommant les hôtes de ses services. Prenez les adresses à vérifier dans le runbook en mémoire."

[translations.fr.inputs.url]
description = "L'adresse complète à vérifier, commençant par http:// ou https://. Sans nom d'utilisateur ni mot de passe."

[translations.ar]
description = "يفحص ما إذا كان عنوان http أو https يستجيب: يرسل طلب GET واحدًا ولا يتبع أي إعادة توجيه، ويعيد {\"url\", \"ok\", \"status\", \"time_ms\"}، مع \"redirect\" إذا أشارت الإجابة إلى عنوان آخر و\"error\" إذا لم تكن هناك إجابة أصلًا (فتكون status صفرًا). تكون \"ok\" صحيحة للحالة من 200 إلى 399. للقراءة فقط. لا يصل إلا إلى المضيفين المدرجين تحت `network`، وهذه الحزمة (pack) تشحن تلك القائمة فارغة، فيبلّغ كل فحص عن خطأ حتى تستبدل مساحة العمل ملف الأداة هذا بنسختها الخاصة التي تسمّي مضيفي خدماتها. خذ العناوين المراد فحصها من runbook في الذاكرة."

[translations.ar.inputs.url]
description = "العنوان الكامل المراد فحصه، ويبدأ بـ http:// أو https://. دون اسم مستخدم أو كلمة مرور."
