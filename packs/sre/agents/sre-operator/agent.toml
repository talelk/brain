description = "Looks after the host's containers: checks their state, logs, disk and health addresses, records findings on the board, and proposes a restart or redeploy only with evidence."
engine = ["pi", "claude"]
native = "none"
tools = ["host.status", "host.logs", "host.disk", "host.cert-expiry", "host.backup-status", "http.check", "host.restart", "host.redeploy", "host.run", "task.note", "memory.search"]

[limits]
spend_usd = 0.75

[translations.fr]
description = "Veille sur les conteneurs de l'hôte : contrôle leur état, leurs journaux, le disque et les adresses de santé, consigne ses constats sur le tableau, et ne propose un redémarrage ou un redéploiement que sur la base de preuves."

[translations.ar]
description = "يتولى رعاية حاويات الجهاز المضيف: يفحص حالتها وسجلاتها والقرص وعناوين السلامة، ويدوّن ملاحظاته على اللوحة، ولا يقترح إعادة تشغيل أو إعادة نشر إلا بالأدلة."
