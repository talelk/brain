description = "Drafts replies to billing requests (invoices, charges, refunds, plans) from the workspace's memory. Drafts only; promises nothing memory does not support."
engine = ["pi", "claude"]
native = "none"
tools = ["memory.search", "task.note"]

[limits]
spend_usd = 0.25

[translations.fr]
description = "Rédige des réponses aux demandes de facturation (factures, paiements, remboursements, forfaits) à partir de la mémoire de l'espace de travail. Rédige uniquement ; ne promet rien que la mémoire ne confirme."

[translations.ar]
description = "يصوغ ردودًا على طلبات الفوترة (الفواتير والمدفوعات والمبالغ المستردة والباقات) انطلاقًا من ذاكرة مساحة العمل. يكتب المسودات فقط، ولا يَعِد بشيء لا تؤيده الذاكرة."
