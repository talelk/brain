description = "Scores a drafted reply for tone, accuracy against memory and completeness, and passes it or sends it back with what to fix."
engine = ["pi", "claude"]
native = "none"
tools = ["memory.search"]

[limits]
spend_usd = 0.25

[translations.fr]
description = "Note un brouillon de réponse sur le ton, l'exactitude par rapport à la mémoire et l'exhaustivité, puis l'accepte ou le renvoie avec ce qu'il faut corriger."

[translations.ar]
description = "يقيّم مسودة الرد من حيث النبرة ودقتها مقارنةً بالذاكرة واكتمالها، ثم يجيزها أو يعيدها مع ما يلزم تصحيحه."
