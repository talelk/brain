description = "Drafts replies to technical requests (errors, access, setup, integrations) from the workspace's memory. Drafts only; gives steps memory supports and asks for what is missing."
engine = ["pi", "claude"]
native = "none"
tools = ["memory.search", "task.note"]

[limits]
spend_usd = 0.25

[translations.fr]
description = "Rédige des réponses aux demandes techniques (erreurs, accès, configuration, intégrations) à partir de la mémoire de l'espace de travail. Rédige uniquement ; donne les étapes que la mémoire confirme et demande ce qui manque."

[translations.ar]
description = "يصوغ ردودًا على الطلبات التقنية (الأخطاء والوصول والإعداد والتكامل) انطلاقًا من ذاكرة مساحة العمل. يكتب المسودات فقط، ويقدّم الخطوات التي تؤيدها الذاكرة، ويطلب ما ينقص."
