description = "Reads where one pull request stands: its state, whether it is merged, draft or mergeable, the checks on its latest commit and the latest review of each reviewer. Read-only. Uses the workspace's `github` secret. Returns {\"number\", \"title\", \"state\", \"merged\", \"draft\", \"mergeable\", \"head_sha\", \"checks\": [{\"name\", \"status\", \"conclusion\"}], \"reviews\": [{\"author\", \"state\"}]}, or {\"error\": \"<why>\"}. `mergeable` is null while GitHub has not worked it out yet."
effect = "read"
timeout_seconds = 40
needs = ["bash", "python3", "curl"]
network = ["api.github.com"]
secrets = ["github"]

[inputs.repo]
type = "string"
description = "The repository, as owner/name."
required = true

[inputs.number]
type = "integer"
description = "The pull request number."
required = true

[translations.fr]
description = "Lit où en est une pull request : son état, si elle est fusionnée, en brouillon ou fusionnable, les vérifications de son dernier commit et le dernier avis de chaque relecteur. Lecture seule. Utilise le secret `github` de l'espace de travail. Renvoie {\"number\", \"title\", \"state\", \"merged\", \"draft\", \"mergeable\", \"head_sha\", \"checks\": [{\"name\", \"status\", \"conclusion\"}], \"reviews\": [{\"author\", \"state\"}]}, ou {\"error\": \"<pourquoi>\"}. `mergeable` vaut null tant que GitHub ne l'a pas calculé."

[translations.fr.inputs.repo]
description = "Le dépôt, sous la forme owner/name."

[translations.fr.inputs.number]
description = "Le numéro de la pull request."

[translations.ar]
description = "يقرأ وضع pull request واحدة: حالتها، وهل هي مدموجة أو مسودة أو قابلة للدمج، وفحوص آخر commit فيها، وآخر مراجعة لكل مراجع. للقراءة فقط. يستخدم السرّ `github` الخاص بمساحة العمل. يعيد {\"number\", \"title\", \"state\", \"merged\", \"draft\", \"mergeable\", \"head_sha\", \"checks\": [{\"name\", \"status\", \"conclusion\"}], \"reviews\": [{\"author\", \"state\"}]}، أو {\"error\": \"<السبب>\"}. تكون قيمة `mergeable` هي null ما دام GitHub لم يحسبها بعد."

[translations.ar.inputs.repo]
description = "المستودع، بصيغة owner/name."

[translations.ar.inputs.number]
description = "رقم الـ pull request."
