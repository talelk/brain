description = "Investigates a project without changing it: finds the cause of an issue, maps what a change touches, and writes findings a developer can act on."
engine = ["pi", "claude"]
native = "read"
tools = ["task.note", "memory.search", "web.fetch"]

[limits]
spend_usd = 0.75

[translations.fr]
description = "Étudie un projet sans le modifier : trouve la cause d'une issue, cartographie ce qu'un changement touche et rédige des conclusions exploitables par un développeur."

[translations.ar]
description = "يستقصي مشروعًا دون تغييره: يجد سبب الـ issue ويحدّد ما يمسّه أي تغيير ويكتب نتائج يستطيع المطوّر البناء عليها."
