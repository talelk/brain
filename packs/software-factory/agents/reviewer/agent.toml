description = "A critic for code changes: checks a diff against its goal, the project's conventions and the recorded test runs, and passes or sends it back."
native = "read"
tools = ["memory.search", "web.fetch"]

[limits]
spend_usd = 0.75

[translations.fr]
description = "Un regard critique sur les changements de code : confronte un diff à son objectif, aux conventions du projet et aux exécutions de tests enregistrées, puis l'accepte ou le renvoie."

[translations.ar]
description = "ناقد لتغييرات الشيفرة: يفحص الـ diff قياسًا إلى هدفه وأعراف المشروع وتشغيلات الاختبارات المسجّلة، ثم يقبله أو يعيده."
