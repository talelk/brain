description = "Opens the pull request for a reviewed change and tells the team. Changes no code."
engine = ["pi", "claude"]
native = "read"
tools = ["git.open-pr", "message.send"]

[limits]
spend_usd = 0.40

[translations.fr]
description = "Ouvre la pull request d'un changement relu et en informe l'équipe. Ne modifie aucun code."

[translations.ar]
description = "يفتح الـ pull request لتغيير تمّت مراجعته ويُعلم الفريق. لا يغيّر أي شيفرة."
