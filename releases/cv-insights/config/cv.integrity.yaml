{
  "apiVersion": "brain.keyrus/v1",
  "kind": "Tool",
  "metadata": {
    "id": "cv.integrity",
    "version": "1.0.0"
  },
  "spec": {
    "effectClass": "read",
    "inputSchemaRef": "schemas/cv-health-input.json",
    "outputSchemaRef": "schemas/cv-validation-output.json",
    "requiredCapabilities": [
      "tool:bash",
      "tool:python3"
    ],
    "timeoutSeconds": 60,
    "maxOutputBytes": 1048576,
    "allowedEnvironments": [
      "cv-insights"
    ],
    "owner": "keyrus_talent_intel",
    "license": "LicenseRef-Internal",
    "entrypoint": "run.sh"
  }
}
