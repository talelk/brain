{
  "apiVersion": "brain.keyrus/v1",
  "kind": "Tool",
  "metadata": {
    "id": "mission.comment",
    "version": "1.0.0"
  },
  "spec": {
    "effectClass": "read",
    "inputSchemaRef": "schemas/mission-comment-input.json",
    "outputSchemaRef": "schemas/mission-comment-output.json",
    "requiredCapabilities": [
      "tool:bash",
      "tool:python3"
    ],
    "timeoutSeconds": 20,
    "maxOutputBytes": 65536,
    "allowedEnvironments": [
      "local"
    ],
    "owner": "team_operations",
    "license": "LicenseRef-Internal",
    "description": "Adds a comment to a work item of this mission (the task this session works on unless one is named). The comment is a note in the task's thread for people and the team; it does not message anyone and never approves or changes anything.",
    "entrypoint": "run.sh",
    "testEntrypoint": "test.sh"
  }
}
