{
  "apiVersion": "brain.keyrus/v1",
  "kind": "Workflow",
  "metadata": {
    "id": "support-draft",
    "version": "1.0.0"
  },
  "spec": {
    "inputSchemaRef": "schemas/support-input.json",
    "outputSchemaRef": "schemas/workflow-output.json",
    "jobs": {
      "respond": {
        "kind": "dispatch",
        "needs": [],
        "input": {
          "title": {
            "source": "input",
            "pointer": "/title"
          },
          "body": {
            "source": "input",
            "pointer": "/body"
          }
        },
        "outputSchemaRef": "schemas/support-output.json",
        "timeoutSeconds": 120,
        "uses": {
          "type": "agent",
          "release": {
            "id": "support-analyst",
            "digest": "sha256:9c9d7e838137d8ac7d229f4504464e72305ff8a2a063a45f95c866716e7a690a"
          }
        },
        "runsOn": {
          "group": "agents",
          "engine": {
            "anyOf": ["pi"],
            "features": ["sessions"]
          },
          "all": [
            "os:linux"
          ],
          "resources": {
            "cpuMillicores": 500,
            "memoryMb": 256,
            "diskMb": 256,
            "slots": 1
          },
          "isolation": "ephemeral-container"
        },
        "effectClass": "read"
      },
      "validate": {
        "kind": "eval",
        "needs": [
          "respond"
        ],
        "input": {
          "kind": {
            "source": "literal",
            "value": "support-draft"
          },
          "report": {
            "source": "job",
            "jobId": "respond",
            "pointer": ""
          }
        },
        "outputSchemaRef": "schemas/validation-output.json",
        "timeoutSeconds": 300,
        "evaluator": {
          "id": "operations-validator",
          "digest": "sha256:874dd7a4cf56ca4d25dc9194b5767fb331251f1109061572aa75ce09c5a9ba0f"
        },
        "runsOn": {
          "group": "evaluators",
          "engine": {
            "anyOf": ["claude"],
            "features": ["sessions"]
          },
          "all": [
            "os:linux",
            "tool:bash",
            "tool:python3"
          ],
          "resources": {
            "cpuMillicores": 500,
            "memoryMb": 256,
            "diskMb": 256,
            "slots": 1
          },
          "isolation": "ephemeral-container"
        },
        "independence": "L1"
      }
    },
    "outputs": {
      "response": {
        "source": "job",
        "jobId": "respond",
        "pointer": ""
      },
      "passed": {
        "source": "job",
        "jobId": "validate",
        "pointer": "/passed"
      }
    },
    "failFast": true,
    "deadlineSeconds": 300,
    "presentation": {
      "title": "Draft a support response",
      "description": "Prepare a response for human review. Nothing is sent.",
      "examples": [
        {
          "title": "Unable to sign in",
          "body": "My session expired and I cannot sign in."
        }
      ],
      "system": false
    }
  }
}
