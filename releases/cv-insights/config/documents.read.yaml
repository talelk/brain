{
  "apiVersion": "brain.keyrus/v1",
  "kind": "Tool",
  "metadata": {
    "id": "documents.read",
    "version": "1.0.0"
  },
  "spec": {
    "effectClass": "read",
    "inputSchemaRef": "schemas/documents-read-input.json",
    "outputSchemaRef": "schemas/documents-read-output.json",
    "requiredCapabilities": [
      "tool:bash",
      "tool:python3"
    ],
    "timeoutSeconds": 20,
    "maxOutputBytes": 65536,
    "allowedEnvironments": [
      "local"
    ],
    "owner": "team_operations",
    "license": "LicenseRef-Internal",
    "description": "Reads one saved workspace document by its id and returns its text, cut to a size limit, with the document title and revision.",
    "entrypoint": "run.sh",
    "testEntrypoint": "test.sh"
  }
}
