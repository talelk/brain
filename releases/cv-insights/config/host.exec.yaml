{
  "apiVersion": "brain.keyrus/v1",
  "kind": "Tool",
  "metadata": {
    "id": "host.exec",
    "version": "1.0.0"
  },
  "spec": {
    "effectClass": "read",
    "inputSchemaRef": "schemas/host-exec-input.json",
    "outputSchemaRef": "schemas/host-exec-output.json",
    "requiredCapabilities": [
      "tool:bash",
      "tool:python3"
    ],
    "timeoutSeconds": 60,
    "maxOutputBytes": 65536,
    "allowedEnvironments": [
      "local"
    ],
    "owner": "team_operations",
    "license": "LicenseRef-Internal",
    "description": "Runs one read-only diagnostic command on the demos host by name (container list, logs, disk, memory, service state, a local or public HTTP check). The operator fixes the real command line; only named arguments are accepted.",
    "entrypoint": "run.sh",
    "testEntrypoint": "test.sh"
  }
}
