{
  "apiVersion": "brain.keyrus/v1",
  "kind": "Workflow",
  "metadata": {
    "id": "coordinator-session",
    "version": "1.0.0"
  },
  "spec": {
    "inputSchemaRef": "schemas/coordinator-input.json",
    "outputSchemaRef": "schemas/workflow-output.json",
    "jobs": {
      "plan": {
        "kind": "dispatch",
        "needs": [],
        "input": {
          "missionId": {
            "source": "input",
            "pointer": "/missionId"
          },
          "reasons": {
            "source": "input",
            "pointer": "/reasons"
          }
        },
        "outputSchemaRef": "schemas/coordinator-output.json",
        "timeoutSeconds": 300,
        "uses": {
          "type": "agent",
          "release": {
            "id": "plan-coordinator",
            "digest": "sha256:2caa40fadf4fd46d7fecf4d7d32497b6787f6caf7c3d9e15a434f10601beb92b"
          }
        },
        "runsOn": {
          "group": "agents",
          "engine": {
            "anyOf": [
              "pi"
            ],
            "features": [
              "sessions"
            ]
          },
          "all": [
            "os:linux",
            "tool:bash",
            "tool:python3"
          ],
          "resources": {
            "cpuMillicores": 500,
            "memoryMb": 256,
            "diskMb": 256,
            "slots": 1
          },
          "isolation": "ephemeral-container"
        },
        "effectClass": "read"
      },
      "validate": {
        "kind": "eval",
        "needs": [
          "plan"
        ],
        "input": {
          "kind": {
            "source": "literal",
            "value": "coordinator-session"
          },
          "report": {
            "source": "job",
            "jobId": "plan",
            "pointer": ""
          }
        },
        "outputSchemaRef": "schemas/validation-output.json",
        "timeoutSeconds": 30,
        "evaluator": {
          "id": "operations-validator",
          "digest": "sha256:874dd7a4cf56ca4d25dc9194b5767fb331251f1109061572aa75ce09c5a9ba0f"
        },
        "runsOn": {
          "group": "evaluators",
          "engine": {
            "anyOf": [
              "claude"
            ],
            "features": [
              "sessions"
            ]
          },
          "all": [
            "os:linux",
            "tool:bash",
            "tool:python3"
          ],
          "resources": {
            "cpuMillicores": 500,
            "memoryMb": 256,
            "diskMb": 256,
            "slots": 1
          },
          "isolation": "ephemeral-container"
        },
        "independence": "L1"
      }
    },
    "outputs": {
      "response": {
        "source": "job",
        "jobId": "plan",
        "pointer": ""
      },
      "passed": {
        "source": "job",
        "jobId": "validate",
        "pointer": "/passed"
      }
    },
    "failFast": true,
    "deadlineSeconds": 600,
    "presentation": {
      "title": "Coordinator session",
      "description": "A mission's coordinator reads what happened and plans or re-plans within the autonomy policy.",
      "system": true
    }
  }
}
