{
  "apiVersion": "brain.keyrus/v1",
  "kind": "Policy",
  "metadata": {
    "id": "operations-policy",
    "version": "1.0.0"
  },
  "spec": {
    "productionHumanApproval": "required",
    "defaultEffect": "deny",
    "allowedOperations": [
      "operations.validate"
    ],
    "deniedOperations": [],
    "maxMicroUsd": 0,
    "maxRuntimeSeconds": 300,
    "minimumIsolation": "ephemeral-container",
    "separationOfDuties": true
  }
}
