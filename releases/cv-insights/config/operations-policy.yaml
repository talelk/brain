{
  "apiVersion": "brain.keyrus/v1",
  "kind": "Policy",
  "metadata": {
    "id": "operations-policy",
    "version": "1.0.0"
  },
  "spec": {
    "productionHumanApproval": "required",
    "defaultEffect": "deny",
    "allowedOperations": [
      "csv.query",
      "cv.integrity",
      "cv.verify",
      "cv.warehouse",
      "documents.read",
      "files.write",
      "git.open-pr",
      "host.exec",
      "host.read",
      "host.reload",
      "host.restart",
      "knowledge.search",
      "message.send",
      "mission.ask",
      "mission.comment",
      "mission.delegate",
      "mission.message-member",
      "mission.propose-plan",
      "mission.submit-handoff",
      "operations.context",
      "operations.validate",
      "task.validate",
      "ticket.create",
      "web.fetch"
    ],
    "deniedOperations": [],
    "maxMicroUsd": 0,
    "maxRuntimeSeconds": 3600,
    "minimumIsolation": "ephemeral-container",
    "separationOfDuties": true
  }
}
