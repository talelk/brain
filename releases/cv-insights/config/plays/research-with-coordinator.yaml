{
  "apiVersion": "brain.keyrus/v1",
  "kind": "Play",
  "metadata": {
    "id": "research-with-coordinator",
    "version": "1.0.0"
  },
  "spec": {
    "title": "Research and write, planned by a coordinator",
    "practice": "data",
    "description": "Like Research and write a brief, with a coordinator on the team. The coordinator reads what each finished task found and re-plans the rest, on its own inside the mission's autonomy and with your confirmation outside it. It starts nothing and signs nothing off. Nothing is sent or changed.",
    "intent": "Research the topic in the brief and write a short written brief (one page) that a colleague can read in two minutes and act on.",
    "successCriteria": [
      "The brief answers the question asked in the goal",
      "Every claim names where it came from, or says it is an assumption",
      "Open questions and what was not checked are listed"
    ],
    "constraints": [
      "Read-only research: do not send, post or change anything"
    ],
    "team": [
      {
        "memberId": "lead",
        "role": "Coordinator",
        "agentId": "plan-coordinator",
        "engine": "pi"
      },
      {
        "memberId": "researcher",
        "role": "Researcher and writer",
        "agentId": "task-worker",
        "engine": "pi"
      }
    ],
    "coordinator": "lead",
    "coordinatorWorkflow": "coordinator-session",
    "plan": {
      "tasks": [
        {
          "id": "gather",
          "title": "Gather the key facts and sources for the topic",
          "criteria": [
            "The key facts needed to answer the goal are listed",
            "Each fact names its source"
          ],
          "dependsOn": [],
          "criterionIds": [
            "c2"
          ],
          "assignment": {
            "kind": "agent",
            "id": "researcher",
            "role": "specialist"
          },
          "estimatedMinutes": 10
        },
        {
          "id": "write",
          "title": "Write the one-page brief from what was gathered",
          "criteria": [
            "The brief answers the question asked in the goal in its first lines",
            "Claims are tied to the gathered sources",
            "Open questions and assumptions are listed"
          ],
          "dependsOn": [
            "gather"
          ],
          "criterionIds": [
            "c1",
            "c3"
          ],
          "assignment": {
            "kind": "agent",
            "id": "researcher",
            "role": "specialist"
          },
          "estimatedMinutes": 10
        }
      ]
    },
    "autonomy": "standard",
    "parkingThreshold": 3,
    "budget": {
      "maxMicroUsd": 2000000,
      "maxWallClockMs": 14400000,
      "memberCap": 3,
      "attemptReserveMicroUsd": 0,
      "finalAllowanceMicroUsd": 200000
    }
  }
}
